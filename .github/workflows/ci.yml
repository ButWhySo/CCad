name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  agent-python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install agent dependencies
        run: python -m pip install -r src/ccad_agent/requirements.txt
      - name: Test provider and checkpoint protocols
        run: |
          python -m py_compile src/ccad_agent/*.py scripts/test_*.py
          python scripts/test_provider_mock.py
          python scripts/test_provider_gemini_secret.py
          python scripts/test_agent_loop_contract.py
          python scripts/test_agent_context_contract.py
          python scripts/test_agent_context_size_contract.py
          python scripts/test_agent_compaction_contract.py
          python scripts/test_provider_timeout_contract.py
          python scripts/test_provider_approval_state_contract.py
          python scripts/test_agent_broker_cancellation_contract.py
          python scripts/test_agent_pending_calls_contract.py
          python scripts/test_memory_store.py
          python scripts/test_memory_command_contract.py
          python scripts/test_memory_context_contract.py
          python scripts/test_agent_config_persistence.py
          python scripts/test_mcp_gui_bridge.py
          python scripts/test_provider_openai_compatible.py
          python scripts/test_cerebras_adapter_contract.py
          python scripts/test_agent_ui_runtime_contract.py
          python scripts/test_agent_checkpoint_restart.py /tmp/ccad-checkpoint-accept.db
          CCAD_RESTART_PHASE=second python scripts/test_agent_checkpoint_restart.py /tmp/ccad-checkpoint-accept.db
          python scripts/test_agent_checkpoint_restart.py /tmp/ccad-checkpoint-deny.db
          CCAD_RESTART_PHASE=decline python scripts/test_agent_checkpoint_restart.py /tmp/ccad-checkpoint-deny.db

  core-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Configure
        run: cmake -S . -B build -DCCAD_WARNINGS_AS_ERRORS=ON -DCCAD_BUILD_GUI=OFF
      - name: Build
        run: cmake --build build --parallel 2
      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          set -o pipefail
          set +e
          ctest --test-dir build --output-on-failure 2>&1 | tee ctest-core-linux.log
          test_exit=${PIPESTATUS[0]}
          if [ "$test_exit" -ne 0 ]; then
            grep -E '^[[:space:]]*[0-9]+ - .* \(Failed\)' ctest-core-linux.log | while IFS= read -r failed_test; do
              echo "::error title=Linux CTest failed test::$failed_test"
            done
          fi
          exit "$test_exit"
      - name: Verbose CLI diagnostics
        if: always()
        continue-on-error: true
        run: |
          set -o pipefail
          ctest --test-dir build -R '^cli$' --output-on-failure -V 2>&1 | tee ctest-cli-linux-verbose.log
      - name: Publish Linux CLI diagnostics
        if: always()
        continue-on-error: true
        run: |
          echo '## Linux CTest diagnostics' >> "$GITHUB_STEP_SUMMARY"
          if [ -f ctest-core-linux.log ]; then
            echo '```text' >> "$GITHUB_STEP_SUMMARY"
            tail -n 220 ctest-core-linux.log >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
          echo '## Linux CLI diagnostics' >> "$GITHUB_STEP_SUMMARY"
          if [ -f ctest-cli-linux-verbose.log ]; then
            echo '```text' >> "$GITHUB_STEP_SUMMARY"
            tail -n 160 ctest-cli-linux-verbose.log >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ctest-core-linux
          path: |
            ctest-core-linux.log
            ctest-cli-linux-verbose.log

  gui-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Install Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-base-dev qt6-svg-dev
      - name: Configure
        run: cmake -S . -B build -DCCAD_WARNINGS_AS_ERRORS=ON -DCCAD_BUILD_GUI=ON
      - name: Build
        run: cmake --build build --parallel 2
      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          set -o pipefail
          set +e
          ctest --test-dir build --output-on-failure 2>&1 | tee ctest-gui-linux.log
          test_exit=${PIPESTATUS[0]}
          if [ "$test_exit" -ne 0 ]; then
            grep -E '^[[:space:]]*[0-9]+ - .* \(Failed\)' ctest-gui-linux.log | while IFS= read -r failed_test; do
              echo "::error title=Linux GUI CTest failed test::$failed_test"
            done
          fi
          exit "$test_exit"
      - name: Verbose CLI diagnostics
        if: always()
        continue-on-error: true
        run: |
          set -o pipefail
          ctest --test-dir build -R '^cli$' --output-on-failure -V 2>&1 | tee ctest-cli-gui-linux-verbose.log
      - name: Publish Linux GUI CLI diagnostics
        if: always()
        continue-on-error: true
        run: |
          echo '## Linux GUI CTest diagnostics' >> "$GITHUB_STEP_SUMMARY"
          if [ -f ctest-gui-linux.log ]; then
            echo '```text' >> "$GITHUB_STEP_SUMMARY"
            tail -n 220 ctest-gui-linux.log >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
          echo '## Linux GUI CLI diagnostics' >> "$GITHUB_STEP_SUMMARY"
          if [ -f ctest-cli-gui-linux-verbose.log ]; then
            echo '```text' >> "$GITHUB_STEP_SUMMARY"
            tail -n 160 ctest-cli-gui-linux-verbose.log >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ctest-gui-linux
          path: |
            ctest-gui-linux.log
            ctest-cli-gui-linux-verbose.log

  core-windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - name: Configure
        run: cmake -S . -B build -DCCAD_WARNINGS_AS_ERRORS=ON -DCCAD_BUILD_GUI=OFF
      - name: Build
        run: cmake --build build --config Release --parallel 2
      - name: Test
        run: |
          ctest --test-dir build --output-on-failure -C Release *> ctest-core-windows.log
          $testExit = $LASTEXITCODE
          Get-Content ctest-core-windows.log
          exit $testExit
      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ctest-core-windows
          path: ctest-core-windows.log
